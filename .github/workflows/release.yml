name: Pack dotfiles
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create tarball
        run: |
          archive="dotfiles-${GITHUB_REF_NAME}.tar.gz"
          git archive \
            --format=tar.gz \
            --output="$archive" \
            HEAD

      - name: Generate SHA256 checksums
        run: |
          sha256sum dotfiles-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: List files
        run: |
          ls -lh

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dotfiles-${{ github.ref_name }}.tar.gz
            SHA256SUMS.txt
